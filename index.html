<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Typing Speed Analyzer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="container">
  <h1>⌨️ AI Typing Speed Analyzer</h1>

  <div class="stats">
    <div class="stat-box">
      <span class="stat-label">⏱ Time</span>
      <span class="stat-value" id="time">60</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">🚀 WPM</span>
      <span class="stat-value" id="wpm">0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">🎯 Accuracy</span>
      <span class="stat-value"><span id="accuracy">100</span>%</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">❌ Errors</span>
      <span class="stat-value" id="errors">0</span>
    </div>
  </div>

  <div id="paragraph" class="paragraph"></div>

  <textarea
    id="input"
    placeholder="Click Start, then type here..."
    disabled
  ></textarea>

  <div class="controls">
    <select id="duration">
      <option value="30">30 s</option>
      <option value="60" selected>60 s</option>
      <option value="120">2 min</option>
      <option value="300">5 min</option>
    </select>
    <button id="btn-start" onclick="startTest()">▶ Start</button>
    <button id="btn-stop"  onclick="stopTest()"  disabled>⏹ Stop</button>
    <button onclick="restartTest()">↺ Restart</button>
  </div>

  <div class="result" id="result-area">
    <h2>Results</h2>
    <div class="result-stats">
      <div class="result-card" id="finalWpm"></div>
      <div class="result-card" id="finalAccuracy"></div>
      <div class="result-card" id="finalErrors"></div>
    </div>
    <div id="feedback" class="feedback"></div>
  </div>

  <canvas id="scoreChart"></canvas>
</div>

<script src="paragraphs.js"></script>
<script src="script.js"></script>
</body>
</html>
