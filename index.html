<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeTest — AI Typing Speed Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <header class="site-header">
    <span class="logo">tt/</span>
    <span class="logo-sub">TypeTest</span>
  </header>

  <main class="container">

    <!-- Stats bar -->
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-val" id="time">60</span>
        <span class="stat-key">sec left</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-val" id="wpm">—</span>
        <span class="stat-key">wpm</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-val"><span id="accuracy">100</span>%</span>
        <span class="stat-key">accuracy</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-val" id="errors">0</span>
        <span class="stat-key">errors</span>
      </div>
    </div>

    <!-- Typing area -->
    <div class="test-card">
      <div id="paragraph" class="paragraph"></div>
      <div class="input-wrap">
        <textarea
          id="input"
          placeholder="press start — then type here"
          disabled
          spellcheck="false"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
        ></textarea>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="duration-group">
        <button class="dur-btn active" data-val="30">30s</button>
        <button class="dur-btn" data-val="60">60s</button>
        <button class="dur-btn" data-val="120">2m</button>
        <button class="dur-btn" data-val="300">5m</button>
      </div>
      <input type="hidden" id="duration" value="60">
      <div class="action-group">
        <button id="btn-start" class="btn btn-start" onclick="startTest()">Start</button>
        <button id="btn-stop"  class="btn btn-stop"  onclick="stopTest()" disabled>Stop</button>
        <button class="btn btn-ghost" onclick="restartTest()">Reset</button>
      </div>
    </div>

    <!-- Results -->
    <div class="result-area" id="result-area">
      <div class="result-header">
        <span class="result-label">session complete</span>
      </div>
      <div class="result-grid">
        <div class="result-card">
          <span class="result-num" id="finalWpm">—</span>
          <span class="result-desc">words / min</span>
        </div>
        <div class="result-card">
          <span class="result-num" id="finalAccuracy">—</span>
          <span class="result-desc">accuracy</span>
        </div>
        <div class="result-card">
          <span class="result-num" id="finalErrors">—</span>
          <span class="result-desc">errors</span>
        </div>
      </div>
      <div id="feedback" class="feedback"></div>
    </div>

    <!-- History chart -->
    <div class="chart-wrap" id="chart-wrap">
      <p class="chart-title">wpm history</p>
      <canvas id="scoreChart"></canvas>
    </div>

  </main>

<script src="paragraphs.js"></script>
<script src="script.js"></script>
</body>
</html>
